[package]
name = "shadowcatch-3-pro-viewer"
version = "0.1.0"
edition = "2021"
description = "A small Linux viewer for ShadowCast 3 Pro capture devices."
license = "MIT"
repository = "https://github.com/nyxalium/shadowcatch-3-pro"

[dependencies]
anyhow = "1"
dirs = "6"
gtk = { package = "gtk4", version = "0.10", features = ["v4_8"] }
gst = { package = "gstreamer", version = "0.24" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
